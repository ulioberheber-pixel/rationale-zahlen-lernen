<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Rationale Zahlen – Interaktiv</title>

    <!-- MathJax für Formeln -->
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        body { font-family: Arial; background:#f4faff; margin:0; padding:0; }
        header { background:#0099cc; color:white; padding:20px; text-align:center; }
        section {
            background:white; max-width:900px; margin:20px auto; padding:20px;
            border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
        h2 { color:#006699; }
        .exercise { background:#f0faff; padding:10px; border-left:4px solid #0099cc; margin-top:10px; }
        input { padding:6px; width:220px; margin-top:5px; }
        button { padding:6px 10px; background:#0099cc; color:white; border:none; cursor:pointer; }
        button:hover { background:#0077aa; }
    </style>
</head>

<body>

<header>
    <h1>Rationale Zahlen – Interaktive Aufgaben</h1>
    <p>Kapitel 1 und 2 mit automatischer Kontrolle</p>
</header>

<section id="kap1">
    <h2>Kapitel 1 – Addieren & Subtrahieren (Interaktiv)</h2>
    <div class="exercise">
        <p id="k1_task"></p>
        <input id="k1_input" placeholder="Lösung als Bruch, z.B. -3/5">
        <button onclick="checkK1()">Prüfen</button>
        <p id="k1_result"></p>
    </div>
</section>

<section id="kap2">
    <h2>Kapitel 2 – Dezimaldarstellung (Interaktiv)</h2>
    <div class="exercise">
        <p id="k2_task"></p>
        <input id="k2_input" placeholder="z.B. 0.125">
        <button onclick="checkK2()">Prüfen</button>
        <p id="k2_result"></p>
    </div>
</section>

<script>
// Hilfsfunktionen
function gcd(a, b) {
    return b === 0 ? a : gcd(b, a % b);
}

function simplify(n, d) {
    let g = gcd(Math.abs(n), Math.abs(d));
    return [n / g, d / g];
}

function fracToString(n, d) {
    let s = simplify(n, d);
    return s[0] + "/" + s[1];
}

function randomFrac() {
    let n = Math.floor(Math.random() * 9) + 1;
    let d = Math.floor(Math.random() * 9) + 1;
    if (Math.random() < 0.5) n *= -1;
    return [n, d];
}

// Kapitel 1
let k1_solution;

function generateK1() {
    let a = randomFrac();
    let b = randomFrac();

    let text = `$ \\frac{${a[0]}}{${a[1]}} + \\frac{${b[0]}}{${b[1]}} $`;
    document.getElementById("k1_task").innerHTML = text;

    let n = a[0] * b[1] + b[0] * a[1];
    let d = a[1] * b[1];
    k1_solution = fracToString(n, d);

    if (window.MathJax) MathJax.typeset();
}

function checkK1() {
    let user = document.getElementById("k1_input").value.replace(/\s+/g, "");
    let out = document.getElementById("k1_result");

    if (user === k1_solution) {
        out.innerHTML = "✔ Richtig!";
        out.style.color = "green";
    } else {
        out.innerHTML = "✘ Falsch. Lösung: " + k1_solution;
        out.style.color = "red";
    }
}

// Kapitel 2
let k2_solution;

function generateK2() {
    let [n, d] = randomFrac();

    let text = `$ \\frac{${n}}{${d}} $`;
    document.getElementById("k2_task").innerHTML = text;

    k2_solution = (n / d).toFixed(5);

    if (window.MathJax) MathJax.typeset();
}

function checkK2() {
    let user = document.getElementById("k2_input").value.replace(",", ".");
    let out = document.getElementById("k2_result");

    if (Math.abs(user - k2_solution) < 0.0001) {
        out.innerHTML = "✔ Richtig!";
        out.style.color = "green";
    } else {
        out.innerHTML = "✘ Falsch. Lösung: " + k2_solution;
        out.style.color = "red";
    }
}

// Seite starten
window.onload = function() {
    generateK1();
    generateK2();
};
</script>

</body>
</html>
