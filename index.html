<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Interaktive Lernseite – Rationale Zahlen</title>

    <!-- MathJax -->
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        body { font-family: Arial; background:#f4faff; margin:0; padding:0; }
        header { background:#0099cc; color:white; padding:20px; text-align:center; }
        nav { background:#e6f7ff; padding:10px; text-align:center; }
        nav a { margin:10px; text-decoration:none; color:#006699; font-weight:bold; }
        section {
            background:white; max-width:900px; margin:20px auto; padding:20px;
            border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
        .exercise { background:#f0faff; padding:10px; border-left:4px solid #0099cc; }
        input { padding:6px; width:200px; margin-top:5px; }
        button { padding:6px 10px; background:#0099cc; color:white; border:none; cursor:pointer; }
        button:hover { background:#0077aa; }
    </style>
</head>

<body>

<header>
    <h1>Interaktive Lernseite – Rationale Zahlen</h1>
    <p>Automatisch generierte Aufgaben mit Kontrolle</p>
</header>

<nav>
    <a href="#kap1">Kapitel 1</a>
    <a href="#kap2">Kapitel 2</a>
    <a href="#kap3">Kapitel 3</a>
</nav>

<!-- Kapitel 1 -->
<section id="kap1">
    <h2>Kapitel 1 – Bruchrechnen</h2>

    <div class="exercise">
        <strong>Aufgabe:</strong>
        <p id="k1_task"></p>

        <input id="k1_input" placeholder="Ergebnis als Bruch eingeben">
        <button onclick="checkK1()">Prüfen</button>
        <p id="k1_result"></p>
    </div>
</section>

<!-- Kapitel 2 -->
<section id="kap2">
    <h2>Kapitel 2 – Brüche ↔ Dezimalzahlen</h2>

    <div class="exercise">
        <strong>Aufgabe:</strong>
        <p id="k2_task"></p>

        <input id="k2_input" placeholder="Ergebnis eingeben">
        <button onclick="checkK2()">Prüfen</button>
        <p id="k2_result"></p>
    </div>
</section>

<!-- Kapitel 3 -->
<section id="kap3">
    <h2>Kapitel 3 – Rechnen mit rationalen Zahlen</h2>

    <div class="exercise">
        <strong>Aufgabe:</strong>
        <p id="k3_task"></p>

        <input id="k3_input" placeholder="Ergebnis als Bruch eingeben">
        <button onclick="checkK3()">Prüfen</button>
        <p id="k3_result"></p>
    </div>
</section>

<script>
/* ---------------------------------------------------------
   Hilfsfunktionen für Brüche
--------------------------------------------------------- */
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function simplify(n, d) {
    let g = gcd(Math.abs(n), Math.abs(d));
    return [n / g, d / g];
}

function fracToString(n, d) {
    let s = simplify(n, d);
    return s[0] + "/" + s[1];
}

/* ---------------------------------------------------------
   Zufallsbruch erzeugen
--------------------------------------------------------- */
function randomFrac() {
    let n = Math.floor(Math.random() * 9) + 1;
    let d = Math.floor(Math.random() * 9) + 1;
    if (Math.random() < 0.5) n *= -1;
    return [n, d];
}

/* ---------------------------------------------------------
   Kapitel 1 – Addition oder Multiplikation
--------------------------------------------------------- */
let k1_a, k1_b, k1_c, k1_d, k1_solution;

function generateK1() {
    [k1_a, k1_b] = randomFrac();
    [k1_c, k1_d] = randomFrac();

    let type = Math.random() < 0.5 ? "add" : "mul";

    if (type === "add") {
        document.getElementById("k1_task").innerHTML =
            `$ \\frac{${k1_a}}{${k1_b}} + \\frac{${k1_c}}{${k1_d}} $`;

        let n = k1_a * k1_d + k1_c * k1_b;
        let d = k1_b * k1_d;
        k1_solution = fracToString(n, d);

    } else {
        document.getElementById("k1_task").innerHTML =
            `$ \\frac{${k1_a}}{${k1_b}} \\cdot \\frac{${k1_c}}{${k1_d}} $`;

        let n = k1_a * k1_c;
        let d = k1_b * k1_d;
        k1_solution = fracToString(n, d);
    }
}

function checkK1() {
    let user = document.getElementById("k1_input").value.replace(/\s+/g, "");
    let out = document.getElementById("k1_result");

    if (user === k1_solution) {
        out.innerHTML = "✔ Richtig!";
        out.style.color = "green";
    } else {
        out.innerHTML = "✘ Falsch. Lösung: " + k1_solution;
        out.style.color = "red";
    }
}

/* ---------------------------------------------------------
   Kapitel 2 – Bruch → Dezimalzahl
--------------------------------------------------------- */
let k2_n, k2_d, k2_solution;

function generateK2() {
    [k2_n, k2_d] = randomFrac();
    document.getElementById("k2_task").innerHTML =
        `$ \\frac{${k2_n}}{${k2_d}} $`;

    k2_solution = (k2_n / k2_d).toFixed(4);
}

function checkK2() {
    let user = document.getElementById("k2_input").value.replace(",", ".");
    let out = document.getElementById("k2_result");

    if (Math.abs(user - k2_solution) < 0.0001) {
        out.innerHTML = "✔ Richtig!";
        out.style.color = "green";
    } else {
        out.innerHTML = "✘ Falsch. Lösung: " + k2_solution;
        out.style.color = "red";
    }
}

/* ---------------------------------------------------------
   Kapitel 3 – Subtraktion oder Division
--------------------------------------------------------- */
let k3_a, k3_b, k3_c, k3_d, k3_solution;

function generateK3() {
    [k3_a, k3_b] = randomFrac();
    [k3_c, k3_d] = randomFrac();

    let type = Math.random() < 0.5 ? "sub" : "div";

    if (type === "sub") {
        document.getElementById("k3_task").innerHTML =
            `$ \\frac{${k3_a}}{${k3_b}} - \\frac{${k3_c}}{${k3_d}} $`;

        let n = k3_a * k3_d - k3_c * k3_b;
        let d = k3_b * k3_d;
        k3_solution = fracToString(n, d);

    } else {
        document.getElementById("k3_task").innerHTML =
            `$ \\frac{${k3_a}}{${k3_b}} : \\frac{${k3_c}}{${k3_d}} $`;

        let n = k3_a * k3_d;
        let d = k3_b * k3_c;
        k3_solution = fracToString(n, d);
    }
}

function checkK3() {
    let user = document.getElementById("k3_input").value.replace(/\s+/g, "");
    let out = document.getElementById("k3_result");

    if (user === k3_solution) {
        out.innerHTML = "✔ Richtig!";
        out.style.color = "green";
    } else {
        out.innerHTML = "✘ Falsch. Lösung: " + k3_solution;
        out.style.color = "red";
    }
}

/* ---------------------------------------------------------
   Seite starten
--------------------------------------------------------- */
window.onload = function() {
    generateK1();
    generateK2();
    generateK3();
    MathJax.typeset();
};
</script>

</body>
</html>
